<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Upcoming Tasks - Garnish Farms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #4c9a2a;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 700;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.45rem 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.78rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        main {
            flex: 1;
            padding: 0.85rem;
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.95rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .task-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 0.75rem;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .badge {
            padding: 0.14rem 0.45rem;
            border-radius: 999px;
            font-size: 0.66rem;
            font-weight: 700;
        }

        .badge-green { background: #dcfce7; color: #166534; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body>
    <header>
        <h1>Upcoming Tasks (Chronological)</h1>
        <div style="display: flex; gap: 0.4rem;">
            <a href="activities.html" class="btn btn-outline">Activities</a>
            <a href="index.html" class="btn">← Dashboard</a>
        </div>
    </header>

    <main>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem;">
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">Chronological Schedule & 30-Day Timeline</span>
                <span style="font-size: 0.72rem; color: var(--text-muted);" id="taskSummary">Loading...</span>
            </div>
            <div style="display: flex; gap: 0.75rem; font-size: 0.68rem; color: var(--text-muted); margin-bottom: 0.7rem; flex-wrap: wrap;">
                <span><strong style="color: #16a34a;">■ Green:</strong> Within target days</span>
                <span><strong style="color: #ca8a04;">■ Yellow:</strong> Past target day on 30-day timeline</span>
            </div>
            <div id="chronoTasksList" style="display: flex; flex-direction: column; gap: 0.55rem;"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://odtalucpwmxcydxbypke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const STAGE_CLOCK_KEY = 'garnish_farms_stage_clock_v1';
        const SHAKEN_BATCHES_KEY = 'garnish_farms_shaken_batches_v1';

        function escapeAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatStrainCode(strain) {
            const cleaned = String(strain || '').trim();
            if (!cleaned) return 'BATCH';
            const lower = cleaned.toLowerCase();
            if (lower.includes('blue oyster') || lower === 'bo') return 'BO';
            if (lower.includes("lion's mane") || lower.includes('lions mane') || lower === 'li') return 'LI';
            if (lower.includes('reishi')) return 'RE';
            if (lower.includes('chestnut')) return 'CH';
            if (lower.includes('shiitake')) return 'SH';
            if (lower.includes('pink oyster')) return 'PO';
            const words = cleaned.replace(/[^a-zA-Z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
            if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
            return words[0].slice(0, 2).toUpperCase();
        }

        function formatMMDDYY(dateStr) {
            const iso = String(dateStr || '').match(/(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return `${iso[2]}${iso[3]}${iso[1].slice(2)}`;
            return '';
        }

        function formatDisplayBatchId(batchId, strain, dateStr) {
            const code = formatStrainCode(strain);
            const stamp = formatMMDDYY(dateStr);
            return stamp ? `${code}-${stamp}` : (batchId || code);
        }

        function getStageClockFromNotes(notesStr, stageName) {
            if (!notesStr || !stageName) return null;
            const stageCode = stageName === 'Bulk Substrate' ? 'SUB' : (stageName === 'Fruiting' ? 'FRT' : 'GRN');
            const match = String(notesStr).match(new RegExp(`\\[Stage:${stageCode}:(\\d{4}-\\d{2}-\\d{2})\\]`));
            return match ? match[1] : null;
        }

        function getEffectiveStageDate(item) {
            try {
                const map = JSON.parse(localStorage.getItem(STAGE_CLOCK_KEY) || '{}');
                const key = `${item.id}::${item.stage}`;
                const noteDate = getStageClockFromNotes(item.notes, item.stage);
                return noteDate || map[key] || item.date;
            } catch (e) {
                return item.date;
            }
        }

        function getDaysActive(dateString) {
            if (!dateString) return 0;
            const parts = String(dateString).split('-');
            let initiated;
            if (parts.length === 3) {
                initiated = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            } else {
                initiated = new Date(dateString);
            }
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.floor((today - initiated) / (1000 * 60 * 60 * 24));
        }

        function addDaysToIso(isoDate, deltaDays) {
            const parts = String(isoDate || '').split('-');
            if (parts.length !== 3) return isoDate || '';
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + Number(deltaDays || 0));
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function renderTimeline30Bar(days, targetDays) {
            const safeDays = Math.max(0, Number(days || 0));
            const safeTarget = Math.max(1, Number(targetDays || 14));
            const horizon = 30;
            const targetPct = Math.min(100, Math.round((safeTarget / horizon) * 100));
            const currentPct = Math.min(100, Math.round((safeDays / horizon) * 100));
            const pastTarget = safeDays > safeTarget;

            const greenWidth = pastTarget ? targetPct : currentPct;
            const yellowWidth = pastTarget ? Math.max(0, currentPct - targetPct) : 0;

            return `
                <div style="margin-top: 0.2rem;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.64rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.16rem;">
                        <span>Day ${safeDays} of 30d timeline</span>
                        <span>Target: Day ${safeTarget}</span>
                    </div>
                    <div style="position: relative; width: 100%; height: 9px; background: #e5e7eb; border-radius: 999px; overflow: hidden; display: flex;">
                        <div style="width: ${greenWidth}%; height: 100%; background-color: #16a34a;"></div>
                        <div style="width: ${yellowWidth}%; height: 100%; background-color: #eab308;"></div>
                        <div style="position: absolute; left: ${targetPct}%; top: 0; bottom: 0; width: 2px; background-color: #111827; opacity: 0.7;"></div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const listEl = document.getElementById('chronoTasksList');
            const summaryEl = document.getElementById('taskSummary');
            const stageTargets = { 'Grain Spawn': 14, 'Bulk Substrate': 14, 'Fruiting': 10 };
            const nextStageMap = { 'Grain Spawn': 'Bulk Substrate', 'Bulk Substrate': 'Fruiting', 'Fruiting': 'Harvest' };

            try {
                const { data, error } = await _supabase.from('batches').select('*').eq('status', 'Active');
                if (error) throw error;

                const items = (data || []).map(b => {
                    const stageDate = getEffectiveStageDate(b);
                    const targetDays = stageTargets[b.stage] || 14;
                    const days = Math.max(0, getDaysActive(stageDate));
                    const targetDate = addDaysToIso(stageDate, targetDays);
                    const pastTarget = days > targetDays;
                    return {
                        b,
                        stageDate,
                        targetDate,
                        targetDays,
                        days,
                        pastTarget,
                        nextAction: nextStageMap[b.stage] || 'Next Stage'
                    };
                }).sort((a, b) => String(a.targetDate || '').localeCompare(String(b.targetDate || '')));

                summaryEl.innerText = `${items.length} active task${items.length === 1 ? '' : 's'}`;

                if (items.length === 0) {
                    listEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">No active upcoming tasks.</div>`;
                    return;
                }

                listEl.innerHTML = items.map(entry => {
                    const { b, targetDate, targetDays, days, pastTarget, nextAction } = entry;
                    const badgeClass = pastTarget ? 'badge-yellow' : 'badge-green';
                    const badgeText = pastTarget ? `Past Day ${targetDays}` : `Target ${targetDate}`;
                    return `
                        <div class="task-card">
                            <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;">
                                <div>
                                    <span style="font-size: 0.7rem; font-weight: 700; color: var(--primary);">${escapeAttr(targetDate)}</span>
                                    <span style="font-size: 0.82rem; font-weight: 700; margin-left: 0.35rem;">${escapeAttr(formatDisplayBatchId(b.batch_id, b.strain, b.date))}</span>
                                    <span style="font-size: 0.75rem; color: var(--text-muted);">• ${escapeAttr(b.strain)} (${escapeAttr(b.stage)} ➔ ${escapeAttr(nextAction)})</span>
                                </div>
                                <span class="badge ${badgeClass}">${escapeAttr(badgeText)}</span>
                            </div>
                            <div style="font-size: 0.72rem; color: var(--text-muted);">${b.quantity} ${escapeAttr(b.container || '')} • Started stage ${escapeAttr(entry.stageDate)}</div>
                            ${renderTimeline30Bar(days, targetDays)}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                listEl.innerHTML = `<div style="text-align: center; color: #dc2626; font-size: 0.8rem;">Could not load upcoming tasks.</div>`;
            }
        });
    </script>
</body>
</html>
