<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garnish Farms - Add Culture</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #d97706;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.15rem;
            color: var(--primary);
            font-weight: 700;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #b45309;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            background: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .form-actions button, .form-actions a {
            flex: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Add Liquid Culture</h1>
        <a href="index.html" class="btn btn-outline">Cancel</a>
    </header>

    <div class="card">
        <form id="cultureForm" onsubmit="handleCultureSubmit(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Culture ID / Syringe Name</label>
                    <input type="text" id="cultureId" required placeholder="e.g. LC-LM-161126">
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Date Inoculated</label>
                    <input type="date" id="cultureDate" required>
                </div>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>Strain</label>
                <select id="cultureStrain" required>
                    <option value="Lion's Mane">Lion's Mane</option>
                    <option value="Blue Oyster">Blue Oyster</option>
                    <option value="Pioppino">Pioppino</option>
                    <option value="Golden Oyster">Golden Oyster</option>
                    <option value="Pink Oyster">Pink Oyster</option>
                    <option value="King Trumpet">King Trumpet</option>
                    <option value="Shiitake">Shiitake</option>
                    <option value="Chestnut">Chestnut</option>
                    <option value="Reishi">Reishi</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>Status</label>
                <select id="cultureStatus" required>
                    <option value="Active">Active</option>
                    <option value="Depleted">Depleted</option>
                    <option value="Contaminated">Contaminated</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label>Notes</label>
                <input type="text" id="cultureNotes" placeholder="Source, generation...">
            </div>

            <div class="form-actions">
                <a href="index.html" class="btn btn-outline" style="color: var(--primary); text-align: center; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">Cancel</a>
                <button type="submit" class="btn">Save Culture</button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://odtalucpwmxcydxbypke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cultureDate').valueAsDate = new Date();
        });

        async function handleCultureSubmit(event) {
            event.preventDefault();
            const payload = {
                culture_id: document.getElementById('cultureId').value,
                date: document.getElementById('cultureDate').value,
                strain: document.getElementById('cultureStrain').value,
                status: document.getElementById('cultureStatus').value,
                notes: document.getElementById('cultureNotes').value
            };
            await _supabase.from('cultures').insert([payload]);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
