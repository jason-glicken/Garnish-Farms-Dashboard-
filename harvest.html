<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvest Log - Garnish Farms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #4c9a2a;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.1rem; color: var(--primary); font-weight: 700; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        main { flex: 1; padding: 0.85rem; max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 0.85rem; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .form-group { margin-bottom: 0.8rem; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 700; margin-bottom: 0.3rem; }
        .form-control { width: 100%; min-width: 0; max-width: 100%; padding: 0.55rem 0.6rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.84rem; background: #ffffff; color: var(--text-main); }
        input[type="date"].form-control { -webkit-appearance: none; appearance: none; min-height: 2.35rem; }
        .row-3 { display: grid; grid-template-columns: 1.25fr 0.95fr 0.8fr; gap: 0.45rem; }
        .row-2-outcome { display: grid; grid-template-columns: 1fr auto; gap: 0.45rem; align-items: end; margin-bottom: 0.8rem; }
        @media (max-width: 430px) {
            .row-3 { grid-template-columns: 1fr 1fr; }
            .row-3 .date-col { grid-column: 1 / -1; }
            .row-2-outcome { grid-template-columns: 1fr; }
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: left; }
        th, td { padding: 0.55rem 0.45rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background: var(--bg-light); color: var(--text-muted); font-weight: 600; }
            .strain-scientific { font-size: .78em; color: var(--text-muted); font-style: italic; font-weight: 500; }
    .strain-nav-card{width:100%;min-width:0;margin-top:.25rem;padding:.45rem .5rem;background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:9px;overflow:hidden}.strain-nav-scroll{display:flex;gap:.35rem;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:.1rem 0}.strain-nav-scroll a{flex:0 0 auto;border-radius:999px!important;text-decoration:none!important;font-weight:700!important}

</style>
<style>.gf-record-link{cursor:pointer;text-decoration:underline;text-decoration-color:#9ab39a;text-underline-offset:2px}.gf-record-link:focus-visible{outline:2px solid #6b8f5e;outline-offset:2px}</style></head>
<body>
    <div id="gf-shared-header" aria-label="Garnish Farms site header"></div>

    <main>
        <div class="card">
            <form id="harvestForm">
                <div class="form-group">
                    <label for="batchSelect">Batch</label>
                    <select id="batchSelect" class="form-control" required></select>
                </div>
                <div class="row-3">
                    <div class="form-group date-col">
                        <label for="harvestDate">Date</label>
                        <input type="date" id="harvestDate" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="flushNumber">Flush #</label>
                        <select id="flushNumber" class="form-control">
                            <option value="1">1st Flush</option>
                            <option value="2">2nd Flush</option>
                            <option value="3">3rd Flush</option>
                            <option value="4">4th+ Flush</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="weightInput">Weight (lbs)</label>
                        <input type="number" id="weightInput" class="form-control" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="row-2-outcome">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="closeStatusInput">Batch Outcome</label>
                        <select id="closeStatusInput" class="form-control">
                            <option value="Keep Active" selected>Keep Active (More Flushes)</option>
                            <option value="Harvested">Close Batch — Harvested</option>
                            <option value="Contaminated">Close Batch — Failed / Contam</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-outline" id="zeroYieldBtn" style="width: 100%; padding: 0.55rem 0.75rem; border-color: #dc2626; color: #dc2626; white-space: nowrap;">Zero Yield (0.00 lbs)</button>
                </div>
                <div class="form-group">
                    <label for="notesInput">Notes</label>
                    <input type="text" id="notesInput" class="form-control" placeholder="Optional flush or failure notes...">
                </div>
                <button type="submit" class="btn" id="saveHarvestBtn" style="width: 100%; padding: 0.68rem;">Save Harvest</button>
            </form>
        </div>

        <div class="card">
            <h2 style="font-size: 0.92rem; margin-bottom: 0.65rem;">Recent Harvests</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Batch ID</th>
                            <th>Strain</th>
                            <th>Flush</th>
                            <th>Weight</th>
                        </tr>
                    </thead>
                    <tbody id="harvestHistoryBody">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://odtalucpwmxcydxbypke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const preselectId = new URLSearchParams(window.location.search).get('id');
        let batches = [];

        function escapeAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        
        function getScientificName(strain) {
            const s = String(strain || '').trim().toLowerCase();
            if (s.includes('blue oyster') || s === 'bo' || s.includes('pearl oyster') || s === 'oy') return 'Pleurotus ostreatus';
            if (s.includes("lion's mane") || s.includes('lions mane') || s.includes('pink lion')) return 'Hericium erinaceus';
            if (s.includes('shiitake') || s === 'sh') return 'Lentinula edodes';
            if (s.includes('maitake')) return 'Grifola frondosa';
            if (s.includes('pink oyster') || s === 'po') return 'Pleurotus djamor';
            if (s.includes('reishi') || s === 're') return 'Ganoderma lingzhi';
            if (s.includes('chestnut') || s === 'ch') return 'Pholiota adiposa';
            if (s.includes('golden teacher') || s === 'gt') return 'Psilocybe cubensis';
            return '';
        }
        function formatStrainWithScientific(strain) {
            const common = String(strain || '').trim();
            const scientific = getScientificName(common);
            return scientific ? `${common} <span class="strain-scientific">(${scientific})</span>` : escapeAttr(common);
        }

        function formatStrainCode(strain) {
            const lower = String(strain || '').trim().toLowerCase();
            if (lower.includes('blue oyster') || lower === 'bo') return 'BO';
            if (lower.includes("lion's mane") || lower.includes('lions mane') || lower === 'li' || lower === 'lm') return 'LM';
            if (lower.includes('golden teacher') || lower === 'gt') return 'GT';
            if (lower.includes('reishi') || lower === 're') return 'RE';
            if (lower.includes('chestnut') || lower === 'ch') return 'CH';
            if (lower.includes('shiitake') || lower === 'sh') return 'SH';
            if (lower.includes('pink oyster') || lower === 'po') return 'PO';
            const words = lower.replace(/[^a-z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
            if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
            return (words[0] || 'BA').slice(0, 2).toUpperCase();
        }

        function formatMMDDYY(dateStr) {
            const m = String(dateStr || '').match(/(\d{4})-(\d{2})-(\d{2})/);
            return m ? `${m[2]}${m[3]}${m[1].slice(2)}` : '';
        }

        function formatDisplayBatchId(batchId, strain, dateStr, qty) {
            const code = formatStrainCode(strain);
            const stamp = formatMMDDYY(dateStr);
            const raw = String(batchId || '').trim().replace(/^GF[-_]?/i, '');
            const base = stamp ? `${code}-${stamp}` : (raw ? `${code}-${raw}` : code);
            const n = Math.max(1, Number(qty || 1));
            return base;
        }

        async function loadHistory() {
            const tbody = document.getElementById('harvestHistoryBody');
            let rows = [];
            try {
                const { data } = await _supabase.from('harvests').select('*').order('harvest_date', { ascending: false }).limit(20);
                if (data) rows = data;
            } catch (e) {}

            try {
                const local = JSON.parse(localStorage.getItem('garnish_farms_harvest_history_v1') || '[]');
                rows = [...rows, ...local];
            } catch (e) {}

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No harvests logged yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = rows.slice(0, 15).map(r => `
                <tr>
                    <td>${escapeAttr(formatDateDisplay(r.harvest_date))}</td>
                    <td><strong>${escapeAttr(formatDisplayBatchId(r.batch_id, r.strain, r.harvest_date, 1))}</strong></td>
                    <td>${formatStrainWithScientific(r.strain)}</td>
                    <td>Flush ${escapeAttr(r.flush_number)}</td>
                    <td><strong>${Number(r.weight_lbs || 0).toFixed(2)} lbs</strong></td>
                </tr>
            `).join('');
        }

        function applyTodayDefaultDate() {
            const dateEl = document.getElementById('harvestDate');
            if (!dateEl) return;
            const now = new Date();
            const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            if (!dateEl.value) {
                dateEl.value = iso;
                dateEl.defaultValue = iso;
            }
        }
        applyTodayDefaultDate();
        window.addEventListener('pageshow', applyTodayDefaultDate);

        document.addEventListener('DOMContentLoaded', async () => {
            applyTodayDefaultDate();

            const { data } = await _supabase.from('batches').select('*').order('created_at', { ascending: false });
            batches = data || [];
            const sel = document.getElementById('batchSelect');
            sel.innerHTML = batches.map(b => {
                const label = `${formatDisplayBatchId(b.batch_id, b.strain, b.date, b.quantity)} — ${b.strain} (${b.stage})`;
                return `<option value="${b.id}" ${String(b.id) === String(preselectId) ? 'selected' : ''}>${escapeAttr(label)}</option>`;
            }).join('');

            loadHistory();
        });

        document.getElementById('zeroYieldBtn').addEventListener('click', () => {
            document.getElementById('weightInput').value = '0.00';
            const closeSel = document.getElementById('closeStatusInput');
            if (closeSel && closeSel.value === 'Keep Active') {
                closeSel.value = 'Harvested';
            }
            const notesEl = document.getElementById('notesInput');
            if (notesEl && !notesEl.value.trim()) {
                notesEl.value = 'Zero yield — closed out';
            }
        });

        document.getElementById('harvestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dbId = Number(document.getElementById('batchSelect').value);
            const batch = batches.find(b => b.id === dbId);
            if (!batch) return;

            const weight = Math.max(0, Number(document.getElementById('weightInput').value || 0));
            const harvestDate = document.getElementById('harvestDate').value;
            const flushNum = Number(document.getElementById('flushNumber').value || 1);
            const closeOutcome = document.getElementById('closeStatusInput').value;
            const rawNotes = document.getElementById('notesInput').value.trim();
            const notes = rawNotes || (weight === 0 ? 'Zero yield' : '');
            const cleanId = formatDisplayBatchId(batch.batch_id, batch.strain, batch.date, batch.quantity);

            const entry = {
                batch_id: cleanId,
                strain: batch.strain,
                harvest_date: harvestDate,
                flush_number: flushNum,
                weight_lbs: weight,
                notes
            };

            try {
                await _supabase.from('harvests').insert([entry]);
            } catch (err) {}

            try {
                const local = JSON.parse(localStorage.getItem('garnish_farms_harvest_history_v1') || '[]');
                local.unshift(entry);
                localStorage.setItem('garnish_farms_harvest_history_v1', JSON.stringify(local));
            } catch (err) {}

            const newTotalYield = Number(batch.harvest_weight || 0) + weight;
            const batchUpdate = { harvest_weight: newTotalYield };
            if (closeOutcome === 'Harvested') {
                batchUpdate.status = 'Harvested';
                batchUpdate.stage = 'Harvested';
            } else if (closeOutcome === 'Contaminated') {
                batchUpdate.status = 'Contaminated';
            }
            if (notes) {
                batchUpdate.notes = batch.notes ? `${batch.notes} [${harvestDate}: ${notes}]` : `[${harvestDate}: ${notes}]`;
            }

            await _supabase.from('batches').update(batchUpdate).eq('id', dbId);
            window.location.href = 'index.html';
        });
    </script>
<script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
<script>
(()=>{
 const q=new URLSearchParams(location.search); const file=location.pathname.split('/').pop()||'index.html';
 const type=(q.get('type')||'').toLowerCase(); const strain=q.get('strain')||'';
 const activeHref = file==='list.html' ? `list.html?type=${type||'jars'}` : file;
 document.querySelectorAll('.gf-site-header a').forEach(a=>{
   const href=a.getAttribute('href')||'';
   if(href==='list.html?type=all' && (file==='batch.html'||(file==='list.html'&&type==='all'))) a.classList.add('gf-active');
   if(href==='list.html?type=jars' && file==='list.html'&&type==='jars') a.classList.add('gf-active');
   if(href==='list.html?type=bags' && file==='list.html'&&type==='bags') a.classList.add('gf-active');
   if(href==='list.html?type=fruiting' && file==='list.html'&&type==='fruiting') a.classList.add('gf-active');
   if(href==='new-batch.html'&&file==='new-batch.html') a.classList.add('gf-active');
   if(href==='harvest.html'&&file==='harvest.html') a.classList.add('gf-active');
   if(href==='yield.html'&&file==='yield.html') a.classList.add('gf-active');
   if(href==='settings.html'&&file==='settings.html') a.classList.add('gf-active');
   if(a.hasAttribute('data-strain')){
     const name=a.getAttribute('data-strain');
     if(file==='list.html') a.href=`list.html?type=${encodeURIComponent(type||'jars')}&strain=${encodeURIComponent(name)}`;
     else if(file==='strain.html') a.href=`strain.html?strain=${encodeURIComponent(name)}`;
     if(strain && strain.toLowerCase()===name.toLowerCase()) a.classList.add('gf-strain-active');
   }
 });
})();
</script>


<script src="gf-data.js?v=1"></script><script src="shared-header.js?v=2"></script>
</body>
</html>
