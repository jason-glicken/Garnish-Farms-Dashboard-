:0 0 .6rem">Yield by Strain</h2><div style="overflow-x:auto"><table><thead><tr><th>Strain</th><th>Flushes</th><th>Total Yield</th><th>Average / Flush</th></tr></thead><tbody id="yieldRows"><tr><td colspan="4">Loading harvest records…</td></tr></tbody></table></div></section></main>
<script>
const db=supabase.createClient('https://odtalucpwmxcydxbypke.supabase.co','sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data,error}=await db.from('harvests').select('*').order('harvest_date',{ascending:false});if(error){document.getElementById('grandTotal').textContent='Could not load';document.getElementById('yieldRows').innerHTML='<tr><td colspan="4">Unable to load harvest records. Please try again.</td></tr>';return;}const rows=data||[],groups={};rows.forEach(r=>{const n=r.strain||'Unknown';groups[n] ||= {count:0,total:0};groups[n].count++;groups[n].total+=Number(r.weight_lbs||0)});const total=rows.reduce((a,r)=>a+Number(r.weight_lbs||0),0);document.getElementById('grandTotal').textContent=total.toFixed(2)+' lbs';document.getElementById('flushCount').textContent=rows.length+' recorded harvest entries';const list=Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);document.getElementById('yieldRows').innerHTML=list.length?list.map(([n,g])=>`<tr><td><a class="strain-link" href="strain.html?strain=${encodeURIComponent(n)}">${esc(n)}</a></td><td>${g.count}</td><td><strong>${g.total.toFixed(2)} lbs</strong></td><td>${(g.total/g.count).toFixed(2)} lbs</td></tr>`).join(''):'<tr><td colspan="4">No harvests recorded yet.</td></tr>'}
init();
</script><script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
