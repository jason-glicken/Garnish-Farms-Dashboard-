<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Yield · Garnish Farms</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--primary:#2d5a27;--bg:#f4f7f2;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:.9rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:3}h1{font-size:1.1rem;color:var(--primary);margin:0}main{max-width:850px;margin:auto;padding:.8rem}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:.85rem;margin-bottom:.75rem}.muted{font-size:.74rem;color:var(--muted)}.btn{border:1px solid var(--primary);border-radius:8px;padding:.45rem .7rem;color:var(--primary);text-decoration:none;font-weight:700;font-size:.75rem}.total{font-size:1.7rem;font-weight:800;color:var(--primary)}table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--border)}th{color:var(--muted);background:#f8faf8}.strain-link{color:var(--primary);font-weight:700;text-decoration:underline}
.strain-nav-card{width:100%;min-width:0;margin-top:.25rem;padding:.45rem .5rem;background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:9px;overflow:hidden}.strain-nav-scroll{display:flex;gap:.35rem;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:.1rem 0}.strain-nav-scroll a{flex:0 0 auto;border-radius:999px!important;text-decoration:none!important;font-weight:700!important}

</style><style>.gf-record-link{cursor:pointer;text-decoration:underline;text-decoration-color:#9ab39a;text-underline-offset:2px}.gf-record-link:focus-visible{outline:2px solid #6b8f5e;outline-offset:2px}</style></head><body><div id="gf-shared-header" aria-label="Garnish Farms site header"></div><main><section class="card"><div class="muted">Combined recorded harvest weight across all strains</div><div class="total" id="grandTotal">Loading…</div><div class="muted" id="flushCount"></div></section><section class="card"><h2 style="font-size:.9rem;color:var(--primary);margin:0 0 .6rem">Yield by Strain</h2><div style="overflow-x:auto"><table><thead><tr><th>Strain</th><th>Flushes</th><th>Total Yield</th><th>Average / Flush</th></tr></thead><tbody id="yieldRows"><tr><td colspan="4">Loading harvest records…</td></tr></tbody></table></div></section></main>
<script>
const db=supabase.createClient('https://odtalucpwmxcydxbypke.supabase.co','sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data,error}=await db.from('harvests').select('*').order('harvest_date',{ascending:false});if(error){document.getElementById('grandTotal').textContent='Could not load';document.getElementById('yieldRows').innerHTML='<tr><td colspan="4">Unable to load harvest records. Please try again.</td></tr>';return;}const rows=data||[],groups={};rows.forEach(r=>{const n=r.strain||'Unknown';groups[n] ||= {count:0,total:0};groups[n].count++;groups[n].total+=Number(r.weight_lbs||0)});const total=rows.reduce((a,r)=>a+Number(r.weight_lbs||0),0);document.getElementById('grandTotal').textContent=total.toFixed(2)+' lbs';document.getElementById('flushCount').textContent=rows.length+' recorded harvest entries';const list=Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);document.getElementById('yieldRows').innerHTML=list.length?list.map(([n,g])=>`<tr><td><a class="strain-link" href="strain.html?strain=${encodeURIComponent(n)}">${esc(n)}</a></td><td>${g.count}</td><td><strong>${g.total.toFixed(2)} lbs</strong></td><td>${(g.total/g.count).toFixed(2)} lbs</td></tr>`).join(''):'<tr><td colspan="4">No harvests recorded yet.</td></tr>'}
init();
</script><script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
<script>
(()=>{
 const q=new URLSearchParams(location.search); const file=location.pathname.split('/').pop()||'index.html';
 const type=(q.get('type')||'').toLowerCase(); const strain=q.get('strain')||'';
 const activeHref = file==='list.html' ? `list.html?type=${type||'jars'}` : file;
 document.querySelectorAll('.gf-site-header a').forEach(a=>{
   const href=a.getAttribute('href')||'';
   if(href==='list.html?type=all' && (file==='batch.html'||(file==='list.html'&&type==='all'))) a.classList.add('gf-active');
   if(href==='list.html?type=jars' && file==='list.html'&&type==='jars') a.classList.add('gf-active');
   if(href==='list.html?type=bags' && file==='list.html'&&type==='bags') a.classList.add('gf-active');
   if(href==='list.html?type=fruiting' && file==='list.html'&&type==='fruiting') a.classList.add('gf-active');
   if(href==='new-batch.html'&&file==='new-batch.html') a.classList.add('gf-active');
   if(href==='harvest.html'&&file==='harvest.html') a.classList.add('gf-active');
   if(href==='yield.html'&&file==='yield.html') a.classList.add('gf-active');
   if(href==='settings.html'&&file==='settings.html') a.classList.add('gf-active');
   if(a.hasAttribute('data-strain')){
     const name=a.getAttribute('data-strain');
     if(file==='list.html') a.href=`list.html?type=${encodeURIComponent(type||'jars')}&strain=${encodeURIComponent(name)}`;
     else if(file==='strain.html') a.href=`strain.html?strain=${encodeURIComponent(name)}`;
     if(strain && strain.toLowerCase()===name.toLowerCase()) a.classList.add('gf-strain-active');
   }
 });
})();
</script>
