<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Yield · Garnish Farms</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

:root{--primary:#2d5a27;--bg:#f4f7f2;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:.9rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:3}h1{font-size:1.1rem;color:var(--primary);margin:0}main{max-width:850px;margin:auto;padding:.8rem}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:.85rem;margin-bottom:.75rem}.muted{font-size:.74rem;color:var(--muted)}.btn{border:1px solid var(--primary);border-radius:8px;padding:.45rem .7rem;color:var(--primary);text-decoration:none;font-weight:700;font-size:.75rem}.total{font-size:1.7rem;font-weight:800;color:var(--primary)}table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--border)}th{color:var(--muted);background:#f8faf8}.strain-link{color:var(--primary);font-weight:700;text-decoration:underline}

.gf-site-header .strain-nav-card{width:100%;min-width:0;margin-top:.02rem;padding:.26rem .35rem;background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:8px;overflow:hidden}

header.gf-site-header{display:flex!important;flex-direction:column!important;align-items:stretch!important;grid-template-columns:none!important;gap:.3rem!important}
header.gf-site-header>div,header.gf-site-header>nav{grid-column:auto!important;min-width:0!important;display:flex!important;justify-content:initial!important;align-items:stretch!important}

.gf-home{background:#2d5a27!important;color:#fff!important;border:1px solid #2d5a27!important;padding:.3rem .55rem!important;font-size:.68rem!important;white-space:nowrap}
.gf-site-header .stat-link-card{transition:background .15s,border-color .15s}

/* V39: keep the four KPI header cards in a full-width four-column grid.
   This must override legacy page rules that style header div:nth-child(2) as flex. */

}

  display:flex!important;

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data,error}=await window.GFData.getHarvests({ orderBy: 'harvest_date', ascending: false });if(error){document.getElementById('grandTotal').textContent='Could not load';document.getElementById('yieldRows').innerHTML='<tr><td colspan="4">Unable to load harvest records. Please try again.</td></tr>';return;}const rows=data||[],groups={};rows.forEach(r=>{const n=r.strain||'Unknown';groups[n] ||= {count:0,total:0};groups[n].count++;groups[n].total+=Number(r.weight_lbs||0)});const total=rows.reduce((a,r)=>a+Number(r.weight_lbs||0),0);document.getElementById('grandTotal').textContent=total.toFixed(2)+' lbs';document.getElementById('flushCount').textContent=rows.length+' recorded harvest entries';const list=Object.entries(groups).sort((a,b)=>b[1].total-a[1].total);document.getElementById('yieldRows').innerHTML=list.length?list.map(([n,g])=>`<tr><td><a class="strain-link" href="strain.html?strain=${encodeURIComponent(n)}">${esc(n)}</a></td><td>${g.count}</td><td><strong>${g.total.toFixed(2)} lbs</strong></td><td>${(g.total/g.count).toFixed(2)} lbs</td></tr>`).join(''):'<tr><td colspan="4">No harvests recorded yet.</td></tr>'}
document.addEventListener('DOMContentLoaded', () => init(), { once: true });
</script><script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
<script>
(()=>{
 const q=new URLSearchParams(location.search); const file=location.pathname.split('/').pop()||'index.html';
 const type=(q.get('type')||'').toLowerCase(); const strain=q.get('strain')||'';
 const activeHref = file==='list.html' ? `list.html?type=${type||'jars'}` : file;
 document.querySelectorAll('.gf-site-header a').forEach(a=>{
   const href=a.getAttribute('href')||'';
   if(href==='list.html?type=all' && (file==='batch.html'||(file==='list.html'&&type==='all'))) a.classList.add('gf-active');
   if(href==='list.html?type=jars' && file==='list.html'&&type==='jars') a.classList.add('gf-active');
   if(href==='list.html?type=bags' && file==='list.html'&&type==='bags') a.classList.add('gf-active');
   if(href==='list.html?type=fruiting' && file==='list.html'&&type==='fruiting') a.classList.add('gf-active');
   if(href==='new-batch.html'&&file==='new-batch.html') a.classList.add('gf-active');
   if(href==='harvest.html'&&file==='harvest.html') a.classList.add('gf-active');
   if(href==='yield.html'&&file==='yield.html') a.classList.add('gf-active');
   if(href==='settings.html'&&file==='settings.html') a.classList.add('gf-active');
   if(a.hasAttribute('data-strain')){
     const name=a.getAttribute('data-strain');
     if(file==='list.html') a.href=`list.html?type=${encodeURIComponent(type||'jars')}&strain=${encodeURIComponent(name)}`;
     else if(file==='strain.html') a.href=`strain.html?strain=${encodeURIComponent(name)}`;
     if(strain && strain.toLowerCase()===name.toLowerCase()) a.classList.add('gf-strain-active');
   }
 });
 const dot=document.getElementById('syncDot'); if(dot && !dot.classList.contains('connected') && !dot.classList.contains('error')) dot.style.background='#9ca3af';
})();
</script>
