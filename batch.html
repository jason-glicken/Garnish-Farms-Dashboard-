<div id="sharedParameters" style="display:none;margin-top:.7rem;padding:.7rem;border:1px solid var(--border);border-radius:8px;background:#f8faf7"><strong style="font-size:.78rem">Shared batch parameters</strong><div class="gf-inventory-grid" id="parentFields">
<label>Strain<input id="parentStrain" value=""></label><label>Batch / inoculation date<input id="parentDate" type="date" value=""></label><label>Default substrate<input id="parentSubstrate" value=""></label>
<label>Target days · Grain Spawn<input id="parentTargetGrain" type="number" min="1" max="365" value="14"></label><label>Target days · Bulk Substrate<input id="parentTargetBulk" type="number" min="1" max="365" value="14"></label><label>Target days · Fruiting<input id="parentTargetFruit" type="number" min="1" max="365" value="14"></label></div>
<button type="button" class="btn btn-outline" id="saveParent" style="margin-top:.55rem">Save shared parameters</button><p class="muted" style="font-size:.65rem;margin:.35rem 0 0">Shared changes flow to containers that still match the parent values. Individual overrides are preserved.</p></div></section><section class="card"><h2 style="font-size:.9rem;margin:0">Individual Containers</h2><p class="muted">Each container has its own stage and status. Updating one does not move the other containers.</p><div id="items">Loading…</div></section></main><script>
const SUPABASE_URL='https://odtalucpwmxcydxbypke.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const id=new URLSearchParams(location.search).get('id');
const stages=['Grain Spawn','Bulk Substrate','Fruiting','Harvested'];
const statuses=['Active','Harvested','Contaminated','Archived'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function strainCode(v){const s=String(v||'').toLowerCase();if(s.includes('blue oyster'))return 'BO';if(s.includes('lion'))return 'LM';if(s.includes('shiitake'))return 'SH';if(s.includes('maitake'))return 'MA';if(s.includes('pink oyster'))return 'PO';if(s.includes('chestnut'))return 'CH';if(s.includes('golden teacher'))return 'GT';if(s.includes('reishi'))return 'RE';const w=s.replace(/[^a-z0-9 ]/g,' ').trim().split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:(w[0]||'BA').slice(0,2)).toUpperCase();}
function baseBatchId(b){const d=String(b?.date||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(d)return `${strainCode(b.strain)}-${d[2]}${d[3]}${d[1].slice(2)}`;const raw=String(b?.batch_id||'').replace(/^GF[-_]?/i,'');const m=raw.match(/(\d{6})/);return m ? `${strainCode(b?.strain)}-${m[1]}` : strainCode(b?.strain);}
function parentBatchLabel(){return baseBatchId(parent);}
const stageColors={'Grain Spawn':'#20a34a','Bulk Substrate':'#d97706','Fruiting':'#3b82f6'};
function lifecycleHtml(x){
 const order=['Grain Spawn','Bulk Substrate','Fruiting'];
 const current=order.indexOf(x.stage||'Grain Spawn');
 const t=targetDays(x), dates=[x.grain_started_on,x.bulk_started_on,x.fruiting_started_on];
 const elapsed=Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date((dates[current]||x.date||parent.date||today())+'T12:00:00'))/86400000));
 const widths=order.map((k,i)=>Math.max(1,Number(t[k])||14)); const total=widths.reduce((a,b)=>a+b,0);
 const segs=order.map((k,i)=>`<div style="height:12px;flex:${widths[i]};background:${stageColors[k]};opacity:${i<=current?1:.16};border-right:2px solid white"></div>`).join('');
 return `<div style="margin-top:.65rem"><div style="display:flex;height:12px;border-radius:8px;overflow:hidden;background:#eef1ee">${segs}</div><div style="display:flex;justify-content:space-between;gap:.3rem;margin-top:.25rem;font-size:.62rem;color:#6b7280"><span>Grain: ${current>0?'Complete':current===0?'Day '+elapsed:'Next'}</span><span>Substrate: ${current>1?'Complete':current===1?'Day '+elapsed:'Next'}</span><span>Fruiting: ${current===2?'Day '+elapsed:'Next'}</span></div><div class="muted" style="margin-top:.3rem">Target plan: ${total} days · ${esc(x.stage||'Grain Spawn')} · Day ${elapsed}</div></div>`;
}
function render(){
 document.getElementById('batchTitle').innerHTML='<strong>'+esc(parentBatchLabel())+' · '+esc(parent.strain)+'</strong>';
 document.getElementById('batchMeta').textContent=(parent.date||'')+' · '+items.length+' '+(items.length===1?'container':'individual containers')+' · '+(parent.substrate||'Substrate not specified');
 const counts={};items.forEach(x=>counts[x.stage]=(counts[x.stage]||0)+1);
 document.getElementById('stageCounts').textContent=stages.slice(0,3).map(k=>k+': '+(counts[k]||0)).join('  ·  ');
 document.getElementById('sharedParameters').style.display=items.length>1?'block':'none';
 document.getElementById('parentStrain').value=parent.strain||'';document.getElementById('parentDate').value=parent.date||'';document.getElementById('parentSubstrate').value=parent.substrate||'';const pt={...{'Grain Spawn':14,'Bulk Substrate':14,'Fruiting':14},...(parent.target_days||{})};document.getElementById('parentTargetGrain').value=pt['Grain Spawn'];document.getElementById('parentTargetBulk').value=pt['Bulk Substrate'];document.getElementById('parentTargetFruit').value=pt.Fruiting;
 document.getElementById('mainContainerCards').innerHTML=items.map((x,index)=>{
  const next=x.stage==='Grain Spawn'?'Bulk Substrate':x.stage==='Bulk Substrate'?'Fruiting':x.stage==='Fruiting'?'Harvested':'';
  const nextLabel=next==='Bulk Substrate'?'Move to Bags':next==='Fruiting'?'Move to Fruiting':'Mark Harvested';
  const cid=x.container_id||`${baseBatchId(parent)}-${index+1}`;
  return `<article class="item" data-main-item-id="${esc(x.id)}" style="display:block;border:1px solid var(--border);border-left:4px solid ${stageColors[x.stage]||'#6b8f5e'};border-radius:10px;padding:.8rem;margin:.55rem 0;background:#fff"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem"><div><strong>${esc(cid)}</strong><div class="muted">${esc(x.strain||parent.strain)} · ${esc(x.container||'Container')}</div></div><span class="badge">${esc(x.stage||'Grain Spawn')}</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.55rem"><span class="muted">${esc(x.status||'Active')}</span><button type="button" class="btn" data-main-action="advance" ${!next||x.status!=='Active'?'disabled':''}>${nextLabel||'Complete'}</button></div>${lifecycleHtml(x)}</article>`;
 }).join('')||'<p class="muted">No individual containers are linked to this batch.</p>';
 document.getElementById('items').innerHTML=items.map((x,index)=>{
   const t=targetDays(x),hist=Array.isArray(x.stage_history)?x.stage_history:[];
   const history=hist.map(h=>`${esc(h.stage||'Stage')} · ${esc(h.date||'')}`).join(' → ')||'No stage history recorded';
   const cid=x.container_id||`${baseBatchId(parent)}-${index+1}`;
   return `<article class="item" data-item-id="${esc(x.id)}" style="display:block;border:1px solid var(--border);border-radius:10px;padding:.8rem;margin:.55rem 0;background:#fff"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap"><div><strong>${esc(cid)}</strong>${items.length>1?`<span class="badge" style="margin-left:.35rem">${index+1} of ${items.length}</span>`:''}<div class="muted">${esc(x.strain||parent.strain)} · ${esc(x.container||'Container')} · ${esc(x.stage||'Grain Spawn')}</div></div><span class="badge">${esc(x.status||'Active')}</span></div>
    <div class="gf-inventory-grid" style="margin-top:.65rem"><label>Current stage<select data-field="stage">${stages.map(v=>`<option ${x.stage===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Status<select data-field="status">${statuses.map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Grain / inoculation date<input type="date" data-field="grain_started_on" value="${esc(x.grain_started_on||'')}"></label><label>Bulk substrate date<input type="date" data-field="bulk_started_on" value="${esc(x.bulk_started_on||'')}"></label><label>Fruiting start date<input type="date" data-field="fruiting_started_on" value="${esc(x.fruiting_started_on||'')}"></label><label>Fruiting method<select data-field="fruiting_method"><option value="">Not selected</option>${['Top fruiting','Out of bag','Slits'].map(v=>`<option ${x.fruiting_method===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Target days · Grain Spawn<input type="number" min="1" max="365" data-target="Grain Spawn" value="${Number(t['Grain Spawn'])}"></label><label>Target days · Bulk Substrate<input type="number" min="1" max="365" data-target="Bulk Substrate" value="${Number(t['Bulk Substrate'])}"></label><label>Target days · Fruiting<input type="number" min="1" max="365" data-target="Fruiting" value="${Number(t.Fruiting)}"></label><label>Substrate override<input data-field="substrate" value="${esc(x.substrate||'')}" placeholder="Inherits parent if blank"></label><label style="grid-column:1/-1">Individual notes<textarea data-field="notes" rows="2">${esc(x.notes||'')}</textarea></label></div><div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem"><button type="button" class="btn btn-outline" data-action="save">Save edits</button></div><div class="muted" style="margin-top:.5rem;font-size:.68rem"><strong>Permanent stage history:</strong> ${history}</div></article>`;
 }).join('')||'<p class="muted">No individual containers recorded.</p>';
}
async function load(){
 if(!id){document.getElementById('items').textContent='Missing batch ID.';return;}
 const [{data:b,error:be},{data:rows,error:ie}]=await Promise.all([db.from('batches').select('*').eq('id',id).single(),db.from('batch_items').select('*').eq('batch_id',id).order('container_id')]);
 if(be||ie){document.getElementById('items').textContent='Unable to load batch. Run v36 and v41 Supabase migrations first. '+(ie?.message||be?.message||'');return;}
 parent=b;items=rows||[];render();
}
function dateForStage(stage){return stage==='Grain Spawn'?'grain_started_on':stage==='Bulk Substrate'?'bulk_started_on':stage==='Fruiting'?'fruiting_started_on':null;}
async function transition(item,stage,when=today()){
 const old=item.stage||'Grain Spawn',patch={stage,current_stage_started_on:when};
 const dateKey=dateForStage(stage);if(dateKey)patch[dateKey]=when;
 if(stage==='Bulk Substrate'||stage==='Fruiting')patch.container='Bag';
 if(stage==='Harvested')patch.status='Harvested';else if(!item.status||item.status==='Harvested')patch.status='Active';
 const hist=Array.isArray(item.stage_history)?item.stage_history:[];
 if(old!==stage)patch.stage_history=[...hist,{from:old,stage,date:when,recorded_at:new Date().toISOString()}];
 const {error}=await db.from('batch_items').update(patch).eq('id',item.id);if(error)throw error;
}
async function saveCard(card){
 const item=items.find(x=>String(x.id)===String(card.dataset.itemId));if(!item)return;
 const patch={};card.querySelectorAll('[data-field]').forEach(el=>{patch[el.dataset.field]=el.value||null;});
 const td={...targetDays(item)};card.querySelectorAll('[data-target]').forEach(el=>{td[el.dataset.target]=Math.max(1,Number(el.value)||14);});
 patch.target_days=td;const parentTargets={...{'Grain Spawn':14,'Bulk Substrate':14,'Fruiting':14},...(parent.target_days||{})};patch.target_overrides={};Object.keys(td).forEach(k=>{if(Number(td[k])!==Number(parentTargets[k]))patch.target_overrides[k]=td[k];});
 const newStage=patch.stage;delete patch.stage;
 const oldStage=item.stage;
 if(newStage&&newStage!==oldStage){const stageDateKey=dateForStage(newStage);const transitionDate=(stageDateKey&&patch[stageDateKey])||today();if(stageDateKey)patch[stageDateKey]=transitionDate;await transition(item,newStage,transitionDate);patch.status=newStage==='Harvested'?'Harvested':((item.status==='Harvested')?'Active':(patch.status||'Active'));patch.stage_history=[...(Array.isArray(item.stage_history)?item.stage_history:[]),{from:oldStage,stage:newStage,date:transitionDate,recorded_at:new Date().toISOString()}];}
 const currentDateKey=dateForStage(newStage||oldStage);if(currentDateKey&&patch[currentDateKey])patch.current_stage_started_on=patch[currentDateKey];
 const hist=Array.isArray(patch.stage_history)?patch.stage_history.slice():(Array.isArray(item.stage_history)?item.stage_history.slice():[]);['grain_started_on','bulk_started_on','fruiting_started_on'].forEach(k=>{if(patch[k]&&patch[k]!==item[k]){const st=k==='grain_started_on'?'Grain Spawn':k==='bulk_started_on'?'Bulk Substrate':'Fruiting';const ix=hist.findIndex(h=>h.stage===st);if(ix>=0)hist[ix]={...hist[ix],date:patch[k],date_corrected:true};else hist.push({stage:st,date:patch[k],date_corrected:true,recorded_at:new Date().toISOString()});}});patch.stage_history=hist;
 const {error}=await db.from('batch_items').update(patch).eq('id',item.id);if(error)throw error;
 await load();
}
document.getElementById('items').addEventListener('click',async e=>{
 const btn=e.target.closest('button[data-action]');if(!btn)return;const card=btn.closest('[data-item-id]');if(!card)return;
 try{btn.disabled=true;if(btn.dataset.action==='advance'){const item=items.find(x=>String(x.id)===String(card.dataset.itemId));const next=item.stage==='Grain Spawn'?'Bulk Substrate':item.stage==='Bulk Substrate'?'Fruiting':'Harvested';if(next==='Harvested'&&!confirm('Mark this container as harvested?'))return;await transition(item,next);await load();}else await saveCard(card);}catch(err){alert('Could not save container: '+(err.message||err));}finally{btn.disabled=false;}
});

document.getElementById('mainContainerCards').addEventListener('click',async e=>{
 const btn=e.target.closest('button[data-main-action="advance"]');if(!btn)return;
 const card=btn.closest('[data-main-item-id]');const item=items.find(x=>String(x.id)===String(card?.dataset.mainItemId));if(!item)return;
 const next=item.stage==='Grain Spawn'?'Bulk Substrate':item.stage==='Bulk Substrate'?'Fruiting':'Harvested';
 if(next==='Harvested'&&!confirm('Mark this container as harvested?'))return;
 try{btn.disabled=true;await transition(item,next);await load();}catch(err){alert('Could not advance container: '+(err.message||err));btn.disabled=false;}
});
document.getElementById('saveParent').addEventListener('click',async()=>{
 const next={strain:document.getElementById('parentStrain').value.trim(),date:document.getElementById('parentDate').value,substrate:document.getElementById('parentSubstrate').value.trim(),target_days:{'Grain Spawn':Math.max(1,Number(document.getElementById('parentTargetGrain').value)||14),'Bulk Substrate':Math.max(1,Number(document.getElementById('parentTargetBulk').value)||14),'Fruiting':Math.max(1,Number(document.getElementById('parentTargetFruit').value)||14)}};
 try{
  const {error}=await db.from('batches').update(next).eq('id',parent.id);if(error)throw error;
  for(const x of items){const patch={};if(x.strain===parent.strain)patch.strain=next.strain;if(x.date===parent.date)patch.date=next.date;if(!x.substrate||x.substrate===parent.substrate)patch.substrate=next.substrate;if(!x.target_overrides||Object.keys(x.target_overrides).length===0)patch.target_days=next.target_days;if(Object.keys(patch).length){const r=await db.from('batch_items').update(patch).eq('id',x.id);if(r.error)throw r.error;}}
  await load();alert('Shared batch parameters saved. Individual overrides were preserved.');
 }catch(err){alert('Could not save shared parameters: '+(err.message||err));}
});
load();
</script><script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
<script>
(()=>{
 const q=new URLSearchParams(location.search); const file=location.pathname.split('/').pop()||'index.html';
 const type=(q.get('type')||'').toLowerCase(); const strain=q.get('strain')||'';
 const activeHref = file==='list.html' ? `list.html?type=${type||'jars'}` : file;
 document.querySelectorAll('.gf-site-header a').forEach(a=>{
   const href=a.getAttribute('href')||'';
   if(href==='list.html?type=all' && (file==='batch.html'||(file==='list.html'&&type==='all'))) a.classList.add('gf-active');
   if(href==='list.html?type=jars' && file==='list.html'&&type==='jars') a.classList.add('gf-active');
   if(href==='list.html?type=bags' && file==='list.html'&&type==='bags') a.classList.add('gf-active');
   if(href==='list.html?type=fruiting' && file==='list.html'&&type==='fruiting') a.classList.add('gf-active');
   if(href==='new-batch.html'&&file==='new-batch.html') a.classList.add('gf-active');
   if(href==='harvest.html'&&file==='harvest.html') a.classList.add('gf-active');
   if(href==='yield.html'&&file==='yield.html') a.classList.add('gf-active');
   if(href==='settings.html'&&file==='settings.html') a.classList.add('gf-active');
   if(a.hasAttribute('data-strain')){
     const name=a.getAttribute('data-strain');
     if(file==='list.html') a.href=`list.html?type=${encodeURIComponent(type||'jars')}&strain=${encodeURIComponent(name)}`;
     else if(file==='strain.html') a.href=`strain.html?strain=${encodeURIComponent(name)}`;
     if(strain && strain.toLowerCase()===name.toLowerCase()) a.classList.add('gf-strain-active');
   }
 });
})();
</script>
