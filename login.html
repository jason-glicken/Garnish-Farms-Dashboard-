<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Garnish Farms</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gf-data.js"></script><style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.login{width:min(100%,420px);background:white;padding:25px;border:1px solid var(--line);border-radius:18px}.login h1{color:var(--green);font-size:24px;margin:0}.login p{color:var(--muted)}</style></head><body><form class="login" id="login"><h1>Garnish Farms</h1><p>Mushroom Production Dashboard</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%;margin-top:16px">Sign in</button><p id="error" class="muted"></p></form><script>GF.session().then(s=>{if(s)location.href='index.html'});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const r=await GF.signIn(email.value,password.value);if(r.error){error.textContent=r.error.message;b.disabled=false}else location.href='index.html'}</script></body></html>
