<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2d5a27"><title>Sign in · Garnish Farms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gf-data.js"></script>
<style>
:root{--green:#2d5a27;--bg:#f4f7f2;--border:#dce5d8;--muted:#647067}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1f2937;padding:1rem}.panel{width:min(100%,420px);background:white;border:1px solid var(--border);border-radius:18px;padding:1.5rem;box-shadow:0 12px 32px #1e3d1a12}.brand{color:var(--green);font-size:1.45rem;font-weight:800;margin:0 0 .35rem}.sub{color:var(--muted);font-size:.9rem;margin:0 0 1.5rem}label{display:block;font-size:.85rem;font-weight:650;margin:.9rem 0 .35rem}input{width:100%;padding:.8rem;border:1px solid #cbd5cc;border-radius:9px;font-size:1rem}button{width:100%;margin-top:1.2rem;border:0;border-radius:9px;padding:.85rem;background:var(--green);color:white;font-size:1rem;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{min-height:1.5rem;margin:.9rem 0 0;font-size:.88rem;color:#a12626}.note{font-size:.78rem;color:var(--muted);margin-top:1.1rem;line-height:1.45}
</style></head><body><main class="panel"><h1 class="brand">Garnish Farms</h1><p class="sub">Mushroom Production Dashboard</p>
<form id="loginForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button><p class="message" id="message" role="alert" aria-live="polite"></p></form>
<p class="note">Use your existing Garnish Farms Supabase email and password. This page does not create a new account or change your password.</p></main>
<script>
(() => {
 const form=document.getElementById('loginForm'), button=document.getElementById('submit'), message=document.getElementById('message');
 const params=new URLSearchParams(location.search); const rawNext=params.get('next')||'index.html';
 const safeNext=rawNext.startsWith('/') && !rawNext.startsWith('//') && rawNext.includes('/Garnish-Farms-Dashboard-/') ? rawNext : 'index.html';
 window.GFData.getAuthState().then(auth=>{if(auth.authenticated) location.replace(new URL(safeNext,location.origin).href);}).catch(()=>{});
 form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';button.disabled=true;button.textContent='Signing in…';
  try{const result=await window.GFData.signInWithPassword(document.getElementById('email').value,document.getElementById('password').value);if(result.error) throw result.error;
   const destination=safeNext.startsWith('/')?new URL(safeNext,location.origin).href:new URL(safeNext,location.href).href;location.replace(destination);
  }catch(error){message.textContent=error.message||'Sign-in failed. Check your email and password.';button.disabled=false;button.textContent='Sign in';}
 });
})();
</script></body></html>
