<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Activities - Garnish Farms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gf-data.js"></script><script src="auth-guard.js?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #4c9a2a;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.1rem; color: var(--primary); font-weight: 700; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 0.45rem 0.8rem; border-radius: 8px; font-weight: 600; font-size: 0.78rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
        .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--primary); }
        main { flex: 1; padding: 0.85rem; max-width: 780px; width: 100%; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 0.95rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .activity-item { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.7rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.78rem; }
            .strain-scientific { font-size: .78em; color: var(--text-muted); font-style: italic; font-weight: 500; }
    .strain-nav-card{width:100%;min-width:0;margin-top:.25rem;padding:.45rem .5rem;background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:9px;overflow:hidden}.strain-nav-scroll{display:flex;gap:.35rem;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:.1rem 0}.strain-nav-scroll a{flex:0 0 auto;border-radius:999px!important;text-decoration:none!important;font-weight:700!important}
.gf-brand-row{display:flex;justify-content:space-between;align-items:center;width:100%;gap:.5rem}
.gf-brand{text-align:left;text-decoration:none;display:block;min-width:0}.gf-brand h1{font-size:1.05rem!important;line-height:1.2;margin:0;color:var(--primary,#2d5a27);font-weight:800}.gf-brand p{display:flex;align-items:center;justify-content:flex-start;gap:.32rem;margin:.13rem 0 0;font-size:.61rem;color:var(--text-muted,#6b7280)}
.gf-settings{padding:.3rem .55rem!important;font-size:.7rem!important;white-space:nowrap}
@media(max-width:520px){.gf-brand h1{font-size:.96rem!important}}
.gf-home{background:#2d5a27!important;color:#fff!important;border:1px solid #2d5a27!important;padding:.3rem .55rem!important;font-size:.68rem!important;white-space:nowrap}
.gf-home:focus,.gf-home:hover{background:#244a20!important}

</style>
<style>.gf-record-link{cursor:pointer;text-decoration:underline;text-decoration-color:#9ab39a;text-underline-offset:2px}.gf-record-link:focus-visible{outline:2px solid #6b8f5e;outline-offset:2px}</style></head>
<body>
    <div id="gf-shared-header" aria-label="Garnish Farms site header"></div>

    <main>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem;">
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">Chronological Activity Log</span>
                <span style="font-size: 0.72rem; color: var(--text-muted);" id="activityCount">Loading...</span>
            </div>
            <div id="allActivitiesList" style="display: flex; flex-direction: column; gap: 0.45rem;"></div>
        </div>
    </main>

    <script>

        function escapeAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        
        function getScientificName(strain) {
            const s = String(strain || '').trim().toLowerCase();
            if (s.includes('blue oyster') || s === 'bo' || s.includes('pearl oyster') || s === 'oy') return 'Pleurotus ostreatus';
            if (s.includes("lion's mane") || s.includes('lions mane') || s.includes('pink lion')) return 'Hericium erinaceus';
            if (s.includes('shiitake') || s === 'sh') return 'Lentinula edodes';
            if (s.includes('maitake')) return 'Grifola frondosa';
            if (s.includes('pink oyster') || s === 'po') return 'Pleurotus djamor';
            if (s.includes('reishi') || s === 're') return 'Ganoderma lingzhi';
            if (s.includes('chestnut') || s === 'ch') return 'Pholiota adiposa';
            if (s.includes('golden teacher') || s === 'gt') return 'Psilocybe cubensis';
            return '';
        }
        function formatStrainWithScientific(strain) {
            const common = String(strain || '').trim();
            const scientific = getScientificName(common);
            return scientific ? `${common} <span class="strain-scientific">(${scientific})</span>` : escapeAttr(common);
        }

        function formatStrainCode(strain) {
            const cleaned = String(strain || '').trim();
            if (!cleaned) return 'BATCH';
            const lower = cleaned.toLowerCase();
            if (lower.includes('blue oyster') || lower === 'bo') return 'BO';
            if (lower.includes("lion's mane") || lower.includes('lions mane') || lower === 'li' || lower === 'lm') return 'LM';
            if (lower.includes('golden teacher') || lower === 'gt') return 'GT';
            if (lower.includes('reishi')) return 'RE';
            if (lower.includes('chestnut')) return 'CH';
            if (lower.includes('shiitake')) return 'SH';
            if (lower.includes('pink oyster')) return 'PO';
            const words = cleaned.replace(/[^a-zA-Z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
            if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
            return words[0].slice(0, 2).toUpperCase();
        }


        function getStrainCardTheme(strain) {
            const code = formatStrainCode(strain);
            const themes = {
                'LM': { bg: '#f8fafc', border: '#64748b' },
                'BO': { bg: '#eff6ff', border: '#3b82f6' },
                'RE': { bg: '#fff5f0', border: '#c2410c' },
                'GT': { bg: '#fefce8', border: '#ca8a04' },
                'CH': { bg: '#fdf8f6', border: '#92400e' },
                'SH': { bg: '#f5f3ff', border: '#6d28d9' },
                'PO': { bg: '#fdf2f8', border: '#db2777' },
                'PI': { bg: '#f0fdf4', border: '#15803d' }
            };
            return themes[code] || { bg: '#f8fafc', border: '#4c9a2a' };
        }

        function formatMMDDYY(dateStr) {
            const iso = String(dateStr || '').match(/(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return `${iso[2]}${iso[3]}${iso[1].slice(2)}`;
            return '';
        }

        function formatDisplayBatchId(batchId, strain, dateStr, qty) {
            const code = formatStrainCode(strain);
            const stamp = formatMMDDYY(dateStr);
            const raw = String(batchId || '').trim().replace(/^GF[-_]?/i, '');
            const base = stamp ? `${code}-${stamp}` : (raw ? `${code}-${raw}` : code);
            const n = Math.max(1, Number(qty || 1));
            return base;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const listEl = document.getElementById('allActivitiesList');
            const countEl = document.getElementById('activityCount');

            try {
                const { data, error } = await window.GFData.repositories.batches.list({ orderBy: 'created_at', ascending: false });
                if (error) throw error;

                const activities = [];
                (data || []).forEach(b => {
                    const notesStr = String(b.notes || '');
                    const subMatch = notesStr.match(/\[Stage:SUB:(\d{4}-\d{2}-\d{2})\]/);
                    const frtMatch = notesStr.match(/\[Stage:FRT:(\d{4}-\d{2}-\d{2})\]/);
                    const shakeMatches = [...notesStr.matchAll(/\[Shaken (\d{4}-\d{2}-\d{2})\]/g)];

                    if (frtMatch) {
                        activities.push({ date: frtMatch[1], label: 'Moved to Fruiting', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    if (subMatch) {
                        activities.push({ date: subMatch[1], label: 'Moved to Bulk Substrate', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    shakeMatches.forEach(m => {
                        activities.push({ date: m[1], label: 'Grain Shaken', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    });
                    if (Number(b.harvest_weight || 0) > 0) {
                        activities.push({ date: b.date, label: `Harvested ${Number(b.harvest_weight).toFixed(1)} lbs`, batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    activities.push({ date: b.date, label: `Logged batch (${b.stage || 'Grain Spawn'})`, batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                });

                activities.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
                countEl.innerText = `${activities.length} total`;

                if (activities.length === 0) {
                    listEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">No activities recorded yet.</div>`;
                    return;
                }

                listEl.innerHTML = activities.map(act => `
                    <div class="activity-item" style="background-color: ${getStrainCardTheme(act.strain).bg}; border-left: 4px solid ${getStrainCardTheme(act.strain).border};">
                        <div>
                            <strong>${escapeAttr(formatDisplayBatchId(act.batchId, act.strain, act.date, act.quantity))}</strong> • ${formatStrainWithScientific(act.strain)} — <span style="color: var(--primary); font-weight: 600;">${escapeAttr(act.label)}</span>
                        </div>
                        <span style="font-size: 0.7rem; color: var(--text-muted); white-space: nowrap;">${escapeAttr(formatDateDisplay(act.date || ''))}</span>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<div style="text-align: center; color: #dc2626; font-size: 0.8rem;">Could not load activities.</div>`;
            }
        });
    </script>
<script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>

<script src="shared-header.js?v=11"></script>
</body>
</html>
