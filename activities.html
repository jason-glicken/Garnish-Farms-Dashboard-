<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Activities - Garnish Farms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #4c9a2a;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-light); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.1rem; color: var(--primary); font-weight: 700; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 0.45rem 0.8rem; border-radius: 8px; font-weight: 600; font-size: 0.78rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
        .btn-outline { background-color: transparent; color: var(--primary); border: 1px solid var(--primary); }
        main { flex: 1; padding: 0.85rem; max-width: 780px; width: 100%; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 0.95rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .activity-item { background: #ffffff; border: 1px solid var(--border); border-radius: 8px; padding: 0.55rem 0.7rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; font-size: 0.78rem; }
            .strain-scientific { font-size: .78em; color: var(--text-muted); font-style: italic; font-weight: 500; }
    
/* V36 shared compact site header */
.gf-site-header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--border,#e5e7eb);padding:6px 10px 7px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(31,41,55,.045)}
.gf-header-top{display:flex;align-items:baseline;gap:9px;min-width:0;line-height:1.15}
.gf-brand{font-size:15px;font-weight:800;color:var(--primary,#2d5a27);text-decoration:none;white-space:nowrap}
.gf-page-title{font-size:11px;color:var(--text-muted,#6b7280);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gf-primary-actions{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:6px;align-items:stretch}
.gf-action{min-width:0;min-height:32px;padding:5px 7px;border-radius:7px;border:1px solid #2d5a27;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;font-size:11px;font-weight:800;line-height:1.1;white-space:nowrap}
.gf-action-primary{background:#2d5a27;color:#fff}.gf-action-secondary{background:#fff;color:#2d5a27}.gf-action-yield{background:#f4f7f2;color:#2d5a27;justify-content:space-between}.gf-action-yield strong{font-size:11px}
.gf-production-nav{display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;padding:0 0 1px;-webkit-overflow-scrolling:touch}.gf-production-nav a{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid #e5e7eb;border-radius:7px;background:#f8faf7;color:#334155;text-decoration:none;font-size:10px;font-weight:800;flex:0 0 auto}.gf-batch-symbol{font-size:15px;line-height:1;color:#2d5a27}
.gf-strain-nav{display:flex;align-items:center;gap:5px;overflow-x:auto;white-space:nowrap;padding:0 0 1px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.gf-strain-link{flex:0 0 auto;padding:4px 8px;border-radius:7px;background:var(--strain-bg);color:var(--strain-fg);border:1px solid color-mix(in srgb,var(--strain-fg) 22%,white);font-size:10px;font-weight:800;text-decoration:none}
.gf-strain-link:active,.gf-strain-link:focus-visible{outline:2px solid var(--strain-fg);outline-offset:1px}
.gf-production-icon{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex:0 0 auto}.gf-production-icon.gf-mushroom-icon{width:auto;height:auto;font-size:15px;line-height:1;vertical-align:-1px}
@media(min-width:700px){.gf-site-header{padding:7px 16px 8px;gap:7px}.gf-header-top{gap:12px}.gf-brand{font-size:16px}.gf-page-title{font-size:12px}.gf-primary-actions{max-width:510px}.gf-action{font-size:12px;min-height:34px}.gf-strain-link{font-size:11px;padding:4px 10px}}

<body>
    <header class="gf-site-header">
  <div class="gf-header-top"><a class="gf-brand" href="index.html">Garnish Farms</a><span class="gf-page-title">Activities</span></div>

<nav class="gf-production-nav" aria-label="Production areas"><a href="list.html?type=jars"><svg class="gf-production-icon gf-jar-icon" viewBox="0 0 24 24" aria-label="Mason Jar" title="Mason Jar"><rect x="7" y="2" width="10" height="2.4" rx="0.7" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/><rect x="6.2" y="4.2" width="11.6" height="2" rx="0.6" fill="#cbd5e1" stroke="#475569" stroke-width="1.1"/><path d="M5.5 7.5 C5.5 6.6 6.2 6.2 7.2 6.2 L16.8 6.2 C17.8 6.2 18.5 6.6 18.5 7.5 L18.5 19.8 C18.5 21 17.6 21.8 16.3 21.8 L7.7 21.8 C6.4 21.8 5.5 21 5.5 19.8 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><path d="M6.5 12.2 L17.5 12.2 L17.5 19.6 C17.5 20.3 17 20.8 16.2 20.8 L7.8 20.8 C7 20.8 6.5 20.3 6.5 19.6 Z" fill="#d6c3a5"/><circle cx="10.2" cy="15.8" r="0.85" fill="#8c7355" opacity="0.75"/><circle cx="13.8" cy="14.9" r="0.75" fill="#8c7355" opacity="0.7"/><circle cx="12" cy="17.8" r="0.9" fill="#8c7355" opacity="0.75"/></svg><span>Jars</span></a><a href="list.html?type=bags"><svg class="gf-production-icon gf-bag-icon" viewBox="0 0 24 24" aria-label="Substrate Block" title="Substrate Block"><path d="M7.5 5.2 L16.5 5.2 L18.5 7.2 L18.5 19.8 C18.5 20.8 17.8 21.5 16.8 21.5 L7.2 21.5 C6.2 21.5 5.5 20.8 5.5 19.8 L5.5 7.2 Z" fill="#8d5b34" stroke="#452712" stroke-width="1.4" stroke-linejoin="round"/><line x1="6.2" y1="7.6" x2="17.8" y2="7.6" stroke="#5c381c" stroke-width="1.2"/><rect x="9" y="3.2" width="6" height="2" rx="0.6" fill="#6f4626" stroke="#452712" stroke-width="1.1"/><path d="M6.5 11.2 L17.5 11.2 L17.5 19.6 C17.5 20.2 17 20.5 16.5 20.5 L7.5 20.5 C7 20.5 6.5 20.2 6.5 19.6 Z" fill="#6b4223"/><rect x="14.2" y="12.6" width="2.2" height="4.2" rx="0.5" fill="#d6b48c" opacity="0.55"/></svg><span>Substrate</span></a><a href="list.html?type=fruiting"><span class="gf-production-icon gf-mushroom-icon" role="img" aria-label="Fruiting">🍄</span><span>Fruiting</span></a><a href="list.html?type=all"><span class="gf-batch-symbol">▦</span><span>Batches</span></a></nav>
  <nav class="gf-strain-nav" aria-label="Strain navigation"><a class="gf-strain-link" href="strain.html?strain=Blue%20Oyster" style="--strain-bg:#dbeafe;--strain-fg:#1e40af">Blue Oyster</a><a class="gf-strain-link" href="strain.html?strain=Lion%27s%20Mane" style="--strain-bg:#e2e8f0;--strain-fg:#334155">Lion's Mane</a><a class="gf-strain-link" href="strain.html?strain=Shiitake" style="--strain-bg:#ede9fe;--strain-fg:#5b21b6">Shiitake</a><a class="gf-strain-link" href="strain.html?strain=Maitake" style="--strain-bg:#dcfce7;--strain-fg:#166534">Maitake</a><a class="gf-strain-link" href="strain.html?strain=Pink%20Oyster" style="--strain-bg:#fce7f3;--strain-fg:#9d174d">Pink Oyster</a><a class="gf-strain-link" href="strain.html?strain=Chestnut" style="--strain-bg:#fef3c7;--strain-fg:#92400e">Chestnut</a><a class="gf-strain-link" href="strain.html?strain=Golden%20Teacher" style="--strain-bg:#fef9c3;--strain-fg:#854d0e">Golden Teacher</a><a class="gf-strain-link" href="strain.html?strain=Reishi" style="--strain-bg:#ffedd5;--strain-fg:#9a3412">Reishi</a></nav>

    <main>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem;">
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">Chronological Activity Log</span>
                <span style="font-size: 0.72rem; color: var(--text-muted);" id="activityCount">Loading...</span>
            </div>
            <div id="allActivitiesList" style="display: flex; flex-direction: column; gap: 0.45rem;"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://odtalucpwmxcydxbypke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function escapeAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        
        function getScientificName(strain) {
            const s = String(strain || '').trim().toLowerCase();
            if (s.includes('blue oyster') || s === 'bo' || s.includes('pearl oyster') || s === 'oy') return 'Pleurotus ostreatus';
            if (s.includes("lion's mane") || s.includes('lions mane') || s.includes('pink lion')) return 'Hericium erinaceus';
            if (s.includes('shiitake') || s === 'sh') return 'Lentinula edodes';
            if (s.includes('maitake')) return 'Grifola frondosa';
            if (s.includes('pink oyster') || s === 'po') return 'Pleurotus djamor';
            if (s.includes('reishi') || s === 're') return 'Ganoderma lingzhi';
            if (s.includes('chestnut') || s === 'ch') return 'Pholiota adiposa';
            if (s.includes('golden teacher') || s === 'gt') return 'Psilocybe cubensis';
            return '';
        }
        function formatStrainWithScientific(strain) {
            const common = String(strain || '').trim();
            const scientific = getScientificName(common);
            return scientific ? `${common} <span class="strain-scientific">(${scientific})</span>` : escapeAttr(common);
        }

        function formatStrainCode(strain) {
            const cleaned = String(strain || '').trim();
            if (!cleaned) return 'BATCH';
            const lower = cleaned.toLowerCase();
            if (lower.includes('blue oyster') || lower === 'bo') return 'BO';
            if (lower.includes("lion's mane") || lower.includes('lions mane') || lower === 'li' || lower === 'lm') return 'LM';
            if (lower.includes('golden teacher') || lower === 'gt') return 'GT';
            if (lower.includes('reishi')) return 'RE';
            if (lower.includes('chestnut')) return 'CH';
            if (lower.includes('shiitake')) return 'SH';
            if (lower.includes('pink oyster')) return 'PO';
            const words = cleaned.replace(/[^a-zA-Z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
            if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
            return words[0].slice(0, 2).toUpperCase();
        }


        function getStrainCardTheme(strain) {
            const code = formatStrainCode(strain);
            const themes = {
                'LM': { bg: '#f8fafc', border: '#64748b' },
                'BO': { bg: '#eff6ff', border: '#3b82f6' },
                'RE': { bg: '#fff5f0', border: '#c2410c' },
                'GT': { bg: '#fefce8', border: '#ca8a04' },
                'CH': { bg: '#fdf8f6', border: '#92400e' },
                'SH': { bg: '#f5f3ff', border: '#6d28d9' },
                'PO': { bg: '#fdf2f8', border: '#db2777' },
                'PI': { bg: '#f0fdf4', border: '#15803d' }
            };
            return themes[code] || { bg: '#f8fafc', border: '#4c9a2a' };
        }

        function formatMMDDYY(dateStr) {
            const iso = String(dateStr || '').match(/(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return `${iso[2]}${iso[3]}${iso[1].slice(2)}`;
            return '';
        }

        function formatDisplayBatchId(batchId, strain, dateStr, qty) {
            const code = formatStrainCode(strain);
            const stamp = formatMMDDYY(dateStr);
            const raw = String(batchId || '').trim().replace(/^GF[-_]?/i, '');
            const base = stamp ? `${code}-${stamp}` : (raw ? `${code}-${raw}` : code);
            const n = Math.max(1, Number(qty || 1));
            return base;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const listEl = document.getElementById('allActivitiesList');
            const countEl = document.getElementById('activityCount');

            try {
                const { data, error } = await _supabase.from('batches').select('*').order('created_at', { ascending: false });
                if (error) throw error;

                const activities = [];
                (data || []).forEach(b => {
                    const notesStr = String(b.notes || '');
                    const subMatch = notesStr.match(/\[Stage:SUB:(\d{4}-\d{2}-\d{2})\]/);
                    const frtMatch = notesStr.match(/\[Stage:FRT:(\d{4}-\d{2}-\d{2})\]/);
                    const shakeMatches = [...notesStr.matchAll(/\[Shaken (\d{4}-\d{2}-\d{2})\]/g)];

                    if (frtMatch) {
                        activities.push({ date: frtMatch[1], label: 'Moved to Fruiting', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    if (subMatch) {
                        activities.push({ date: subMatch[1], label: 'Moved to Bulk Substrate', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    shakeMatches.forEach(m => {
                        activities.push({ date: m[1], label: 'Grain Shaken', batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    });
                    if (Number(b.harvest_weight || 0) > 0) {
                        activities.push({ date: b.date, label: `Harvested ${Number(b.harvest_weight).toFixed(1)} lbs`, batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                    }
                    activities.push({ date: b.date, label: `Logged batch (${b.stage || 'Grain Spawn'})`, batchId: b.batch_id, strain: b.strain, quantity: b.quantity });
                });

                activities.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
                countEl.innerText = `${activities.length} total`;

                if (activities.length === 0) {
                    listEl.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">No activities recorded yet.</div>`;
                    return;
                }

                listEl.innerHTML = activities.map(act => `
                    <div class="activity-item" style="background-color: ${getStrainCardTheme(act.strain).bg}; border-left: 4px solid ${getStrainCardTheme(act.strain).border};">
                        <div>
                            <strong>${escapeAttr(formatDisplayBatchId(act.batchId, act.strain, act.date, act.quantity))}</strong> • ${formatStrainWithScientific(act.strain)} — <span style="color: var(--primary); font-weight: 600;">${escapeAttr(act.label)}</span>
                        </div>
                        <span style="font-size: 0.7rem; color: var(--text-muted); white-space: nowrap;">${escapeAttr(formatDateDisplay(act.date || ''))}</span>
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<div style="text-align: center; color: #dc2626; font-size: 0.8rem;">Could not load activities.</div>`;
            }
        });
    </script>
<script>function formatDateDisplay(value){if(!value)return '';const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1].slice(2)}`:String(value);}</script>
</body>
