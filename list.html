<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garnish Farms - Mushrooms</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3d1a;
            --accent: #4c9a2a;
            --bg-light: #f4f7f2;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 0.4rem;
        }

        .logo-area h1 {
            font-size: 1.15rem;
            color: var(--primary);
            font-weight: 700;
        }

        .logo-area p {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9ca3af;
            display: inline-block;
        }

        .sync-dot.connected { background-color: #16a34a; }
        .sync-dot.error { background-color: #dc2626; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            text-decoration: none;
        }

        .btn:hover { background-color: var(--primary-hover); }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover { background-color: var(--bg-light); }

        .stat-link-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem;
            text-decoration: none;
            display: block;
            color: inherit;
            cursor: pointer;
        }
        .stat-link-card.active-tab {
            border-color: var(--primary);
            background-color: #e6f4ea;
        }

        main {
            flex: 1;
            padding: 0.75rem;
            max-width: 100%;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .card-header h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .tab-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .tab-btn {
            background: var(--bg-light);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.45rem;
            font-size: 0.78rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .batch-list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .batch-item-card {
            background: var(--bg-light);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .batch-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .batch-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="index.html" class="logo-area" style="text-align: left; text-decoration: none; display: block;">
                <h1>Garnish Farms - Mushrooms</h1>
                <p><span class="sync-dot" id="syncDot"></span><span id="syncStatus">Connecting...</span></p>
            </a>
            <div style="display: flex; gap: 0.4rem;">
                <a href="index.html" class="btn btn-outline" style="padding: 0.35rem 0.6rem; font-size: 0.75rem;">← Home</a>
                <a href="new-batch.html" class="btn" style="padding: 0.35rem 0.6rem; font-size: 0.75rem;">+ Batch</a>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; width: 100%; margin-top: 0.4rem; text-align: center;">
            <a href="index.html" class="stat-link-card">
                <div style="font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Active</div>
                <div style="font-size: 1rem; font-weight: 700; color: var(--primary);" id="kpi-active">0</div>
            </a>
            <a href="list.html?type=jars" id="nav-jars" class="stat-link-card">
                <div style="font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Jars</div>
                <div style="font-size: 1rem; font-weight: 700; color: var(--primary);" id="kpi-jars">0</div>
            </a>
            <a href="list.html?type=bags" id="nav-bags" class="stat-link-card">
                <div style="font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Bags</div>
                <div style="font-size: 1rem; font-weight: 700; color: var(--primary);" id="kpi-bags">0</div>
            </a>
            <a href="index.html" class="stat-link-card">
                <div style="font-size: 0.62rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Yield</div>
                <div style="font-size: 1rem; font-weight: 700; color: var(--primary);" id="kpi-yield">0.0</div>
            </a>
        </div>
    </header>

    <main>
        <div class="card">
            <div class="card-header">
                <h2 id="listTitle">Active Batches</h2>
                <span id="listTotalBadge" style="font-size: 0.8rem; font-weight: 700; color: var(--primary); background: #e6f4ea; padding: 0.2rem 0.55rem; border-radius: 999px;">0 Total</span>
            </div>

            <div class="tab-bar">
                <a href="list.html?type=jars" id="tab-jars" class="tab-btn">Jars</a>
                <a href="list.html?type=bags" id="tab-bags" class="tab-btn">Bags</a>
                <a href="list.html?type=fruiting" id="tab-fruiting" class="tab-btn">Fruiting</a>
            </div>

            <div id="strainFilterBanner" style="display: none; margin-bottom: 0.75rem; font-size: 0.78rem; color: var(--primary); font-weight: 600; justify-content: space-between; align-items: center; background: #e6f4ea; padding: 0.4rem 0.65rem; border-radius: 8px;">
                <span id="strainFilterText"></span>
                <a id="clearStrainLink" href="#" style="color: var(--primary); text-decoration: underline;">Show All Strains</a>
            </div>

            <div class="batch-list" id="batchListContainer">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0;">Loading batches...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://odtalucpwmxcydxbypke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_FjnWmIJaLHxxf0nIOB1SSQ_gOMJxbrm';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const params = new URLSearchParams(window.location.search);
        const listType = (params.get('type') || 'jars').toLowerCase();
        const strainFilter = params.get('strain') || '';

        let batches = [];

        function setSyncState(state, message) {
            document.getElementById('syncDot').className = 'sync-dot ' + state;
            document.getElementById('syncStatus').innerText = message;
        }

        
        const SHAKEN_BATCHES_KEY = 'garnish_farms_shaken_batches_v1';

        function getShakenMap() {
            try {
                return JSON.parse(localStorage.getItem(SHAKEN_BATCHES_KEY) || '{}');
            } catch (e) {
                return {};
            }
        }

        function isBatchShaken(item) {
            const map = getShakenMap();
            const record = map[String(item.dbId)];
            if (!record) return false;
            return record.batchDate === item.date;
        }

        async function markBatchShaken(dbId) {
            const batch = batches.find(b => b.dbId === dbId);
            if (!batch) return;

            const map = getShakenMap();
            const todayStr = new Date().toISOString().split('T')[0];
            map[String(dbId)] = {
                batchDate: batch.date,
                shakenDate: todayStr
            };
            localStorage.setItem(SHAKEN_BATCHES_KEY, JSON.stringify(map));

            const shakeNote = `[Shaken ${todayStr}]`;
            if (!batch.notes || !batch.notes.includes(shakeNote)) {
                const updatedNotes = batch.notes ? `${batch.notes} ${shakeNote}` : shakeNote;
                await _supabase.from('batches').update({ notes: updatedNotes }).eq('id', dbId);
                batch.notes = updatedNotes;
            }

            renderPage();
        }

const STAGE_CLOCK_KEY = 'garnish_farms_stage_clock_v1';

        function getStageClockMap() {
            try {
                return JSON.parse(localStorage.getItem(STAGE_CLOCK_KEY) || '{}');
            } catch (e) {
                return {};
            }
        }

        function setStageClockDate(dbId, stageName, isoDateStr) {
            const map = getStageClockMap();
            map[`${dbId}::${stageName}`] = isoDateStr;
            localStorage.setItem(STAGE_CLOCK_KEY, JSON.stringify(map));
        }

        function getEffectiveStageDate(item) {
            const map = getStageClockMap();
            return map[`${item.dbId}::${item.stage}`] || item.date;
        }

        function getDaysActive(dateString) {
            if (!dateString) return 0;
            const parts = String(dateString).split('-');
            let initiated;
            if (parts.length === 3) {
                initiated = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            } else {
                initiated = new Date(dateString);
            }
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.floor((today - initiated) / (1000 * 60 * 60 * 24));
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupPageHeader();
            loadBatches();
        });

        function setupPageHeader() {
            const titles = {
                jars: 'Active Jars List',
                bags: 'Active Bags List',
                fruiting: 'Fruiting Batches List'
            };
            document.getElementById('listTitle').innerText = titles[listType] || 'Active Batches';

            const activeTab = document.getElementById(`tab-${listType}`);
            if (activeTab) activeTab.classList.add('active');

            const activeNav = document.getElementById(`nav-${listType}`);
            if (activeNav) activeNav.classList.add('active-tab');

            if (strainFilter) {
                const banner = document.getElementById('strainFilterBanner');
                banner.style.display = 'flex';
                document.getElementById('strainFilterText').innerText = `Filtered by: ${strainFilter}`;
                document.getElementById('clearStrainLink').href = `list.html?type=${encodeURIComponent(listType)}`;
            }
        }

        async function loadBatches() {
            setSyncState('', 'Syncing...');
            try {
                const { data, error } = await _supabase
                    .from('batches')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                batches = (data || []).map(b => ({
                    dbId: b.id,
                    batchId: b.batch_id,
                    date: b.date,
                    strain: b.strain,
                    stage: b.stage,
                    quantity: b.quantity,
                    container: b.container,
                    substrate: b.substrate,
                    harvestWeight: b.harvest_weight,
                    status: b.status,
                    notes: b.notes
                }));

                setSyncState('connected', 'Cloud Synced');
                renderPage();
            } catch (err) {
                setSyncState('error', 'Sync Error');
            }
        }

        function renderPage() {
            const active = batches.filter(b => b.status === 'Active');
            const totalJars = active.filter(b => b.container === 'Jar' && b.stage !== 'Fruiting').reduce((sum, b) => sum + Number(b.quantity || 0), 0);
            const totalBags = active.filter(b => b.container === 'Bag' && b.stage !== 'Fruiting').reduce((sum, b) => sum + Number(b.quantity || 0), 0);
            const totalYield = batches.reduce((sum, b) => sum + Number(b.harvestWeight || 0), 0);

            document.getElementById('kpi-active').innerText = active.length;
            document.getElementById('kpi-jars').innerText = totalJars;
            document.getElementById('kpi-bags').innerText = totalBags;
            document.getElementById('kpi-yield').innerText = totalYield.toFixed(1);

            let filtered = active;
            if (listType === 'jars') {
                filtered = active.filter(b => b.container === 'Jar' && b.stage !== 'Fruiting');
            } else if (listType === 'bags') {
                filtered = active.filter(b => b.container === 'Bag' && b.stage !== 'Fruiting');
            } else if (listType === 'fruiting') {
                filtered = active.filter(b => b.stage === 'Fruiting');
            }

            if (strainFilter) {
                filtered = filtered.filter(b => b.strain === strainFilter);
            }

            const totalUnits = filtered.reduce((sum, b) => sum + Number(b.quantity || 0), 0);
            document.getElementById('listTotalBadge').innerText = `${totalUnits} Total (${filtered.length} Batch${filtered.length === 1 ? '' : 'es'})`;

            const container = document.getElementById('batchListContainer');
            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 1rem 0;">No active batches found for this view.</div>`;
                return;
            }

            container.innerHTML = filtered.map(b => {
                const days = Math.max(0, getDaysActive(getEffectiveStageDate(b)));
                const alreadyShaken = b.stage === 'Grain Spawn' && isBatchShaken(b);
                const needsShake = b.stage === 'Grain Spawn' && days >= 14 && !alreadyShaken;
                const shakeBadge = needsShake
                    ? `<span style="background: #fef3c7; color: #b45309; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.65rem; font-weight: 700; margin-left: 0.35rem;">⚠️ Shake Due (${days}d)</span>`
                    : (alreadyShaken
                        ? `<span style="background: #e6f4ea; color: #137333; padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.65rem; font-weight: 700; margin-left: 0.35rem;">Shaken ✓ (${days}d)</span>`
                        : '');

                const shakeBtn = needsShake
                    ? `<button type="button" class="btn btn-outline" onclick="markBatchShaken(${b.dbId})" style="padding: 0.25rem 0.5rem; font-size: 0.7rem; color: #b45309; border-color: #d97706;">Shaken ✓</button>`
                    : '';

                return `
                    <div class="batch-item-card">
                        <div>
                            <div class="batch-title">${escapeHtml(b.batchId)} — ${escapeHtml(b.strain)}${shakeBadge}</div>
                            <div class="batch-sub">Stage: <strong>${escapeHtml(b.stage)}</strong> • Qty: <strong>${b.quantity} ${escapeHtml(b.container || '')}</strong></div>
                            <div class="batch-sub">Date: ${escapeHtml(b.date)} (${days}d ago)${b.substrate ? ' • ' + escapeHtml(b.substrate) : ''}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 0.35rem; align-items: flex-end;">
                            ${shakeBtn}
                            <a href="new-batch.html?id=${b.dbId}" class="btn btn-outline" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;">Edit</a>
                            <button type="button" class="btn" onclick="advanceStage(${b.dbId})" style="padding: 0.25rem 0.5rem; font-size: 0.7rem; background-color: var(--accent);">Advance ➔</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function advanceStage(dbId) {
            const stages = ['Grain Spawn', 'Bulk Substrate', 'Fruiting', 'Harvested'];
            const batch = batches.find(b => b.dbId === dbId);
            if (!batch) return;

            const currentIndex = stages.indexOf(batch.stage);
            if (currentIndex >= 0 && currentIndex < stages.length - 1) {
                const nextStage = stages[currentIndex + 1];
                const nextStatus = nextStage === 'Harvested' ? 'Harvested' : batch.status;
                const now = new Date();
                const todayLocal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                const updatePayload = { stage: nextStage, status: nextStatus };
                if (nextStage === 'Bulk Substrate' && batch.container === 'Jar') {
                    updatePayload.container = 'Bag';
                }

                const { error } = await _supabase
                    .from('batches')
                    .update(updatePayload)
                    .eq('id', dbId);

                if (!error) {
                    setStageClockDate(dbId, nextStage, todayLocal);
                    await loadBatches();
                }
            }
        }
    </script>
</body>
</html>
